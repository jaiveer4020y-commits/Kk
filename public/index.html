<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vidout – Multi-Audio Player for Movies & TV Shows</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for .m3u8 streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Dash.js for .mpd DASH streams -->
    <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>

    <style>
        html,body{height:100%;width:100vw;margin:0;padding:0;overflow:hidden;font-family:sans-serif;background:#000}
        #video-container{width:100vw;height:100dvh;background:#000}
        #server-menu {
            position: absolute; top: 60px; left: 16px; background: #1a1a1a; border-radius: 8px;
            padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 9999; min-width: 220px; display: none; border: 1px solid #333;
        }
        #server-menu.visible { display: block; }
        .server-option { display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: #b3b3b3; cursor: pointer; border-radius: 4px; }
        .server-option:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .server-option.active { color: #fff; background: rgba(225,0,0,0.2); }
    </style>
</head>
<body>
<div id="video-container" class="relative">
    <video id="video" class="h-full w-full object-contain" autoplay playsinline disableremoteplayback></video>

    <!-- Server Menu Button / Toggle -->
    <button id="server-toggle-button" class="absolute top-4 left-4 z-30 bg-black/60 p-2 rounded-md text-white">Servers 🔽</button>
    <div id="server-menu">
        <h4 class="text-white font-bold mb-2">Select Server & Quality</h4>
        <div id="server-list">
            <div class="server-option">Loading servers...</div>
        </div>
    </div>
</div>

<script>
const video = document.getElementById('video');
let hlsInstance = null;
let dashInstance = null;
let availableServers = {};
let currentServer = 'default';

async function fetchAllSources(title, id, type, s, e) {
    let url = `/api/source?title=${encodeURIComponent(title || '')}&id=${id || ''}&type=${type}&source=all`;
    if (type === 'tv') url += `&s=${s || 1}&e=${e || 1}`;
    
    try {
        const res = await fetch(url);
        const data = await res.json();
        availableServers = {};

        const sourcesArray = data.sources || (data.source ? [data] : []);
        
        sourcesArray.forEach(source => {
            if (source.source === 'reelsdownload') {
                (source.qualities || []).forEach((q, idx) => {
                    const key = `reelsdownload_${q.quality}_${idx}`;
                    availableServers[key] = {
                        name: `ReelsDownload [${q.quality}] (${q.language})`,
                        type: 'dash',
                        url: q.url,
                        subtitles: source.subtitles || []
                    };
                });
            } else if (source.source === 'moviebox') {
                (source.audioTracks || []).forEach(track => {
                    availableServers[`moviebox_${track.language}`] = {
                        name: `MovieBox [${track.language}]`,
                        type: 'proxy',
                        url: track.urlWithHeaders || track.url,
                        subtitles: source.subtitles || []
                    };
                });
            } else if (source.source === 'castle') {
                availableServers['castle'] = { name: 'Castle', type: 'hls', url: source.videoUrl, subtitles: source.subtitles || [] };
            } else if (source.source === 'modiplay' && source.success) {
                availableServers['modiplay'] = { name: 'ModiPlay', type: 'hls', url: source.videoUrl };
            }
        });

        updateServerMenu();
    } catch (err) {
        console.error('Failed to fetch servers:', err);
    }
}

function updateServerMenu() {
    const list = document.getElementById('server-list');
    list.innerHTML = '';
    
    Object.keys(availableServers).forEach(key => {
        const s = availableServers[key];
        const div = document.createElement('div');
        div.className = `server-option ${currentServer === key ? 'active' : ''}`;
        div.innerHTML = `<span>🎬 ${s.name}</span>`;
        div.onclick = () => {
            currentServer = key;
            document.getElementById('server-menu').classList.remove('visible');
            initPlayer(s.url);
        };
        list.appendChild(div);
    });
}

document.getElementById('server-toggle-button').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('server-menu').classList.toggle('visible');
});

// --- UNIFIED PLAYER INITIALIZER (Supports HLS, DASH, and Direct MP4) ---
function initPlayer(url) {
    console.log('[Player] Initializing URL:', url);

    // Clean up previous instances
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    if (dashInstance) { dashInstance.reset(); dashInstance = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();

    // 1. DASH Stream (.mpd)
    if (url.includes('.mpd')) {
        console.log('[Player] Loading DASH stream via Dash.js');
        if (typeof dashjs !== 'undefined') {
            dashInstance = dashjs.MediaPlayer().create();
            dashInstance.initialize(video, url, true);
        } else {
            console.error('Dash.js library not found!');
        }
        return;
    }

    // 2. HLS Stream (.m3u8)
    if (url.includes('.m3u8') && Hls.isSupported()) {
        console.log('[Player] Loading HLS stream via Hls.js');
        hlsInstance = new Hls({ renderTextTracksNatively: true });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        return;
    }

    // 3. Native / Direct Video
    console.log('[Player] Loading direct video source');
    video.src = url;
    video.play().catch(e => console.warn('Autoplay prevented:', e));
}

window.onload = () => {
    // Initial fetch for demo/testing (replace with your dynamic title/ID extractors)
    fetchAllSources("Mirzapur", "1399", "tv", 1, 1);
};
</script>
</body>
</html>
