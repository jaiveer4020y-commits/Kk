          .report-modal-title { font-size: 16px; }
          .report-issue-btn { width: 100%; }
        }

        /* ---- IntroDB Skip Prompt Button ---- */
        #skip-prompt {
            position: absolute;
            bottom: 90px;
            right: 20px;
            z-index: 25;
            opacity: 0;
            pointer-events: none;
            transform: translateY(6px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        #skip-prompt.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        #skip-prompt-btn {
            background: #fff;
            color: #000;
            border: 1.5px solid rgba(255,255,255,0.75);
            border-radius: 3px;
            padding: 9px 22px;
            font-family: 'Netflix Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        #skip-prompt-btn:hover {
            background: rgba(255,255,255,0.18);
            border-color: #fff;
        }
        @media (max-width: 600px) {
            #skip-prompt { bottom: 80px; right: 12px; }
            #skip-prompt-btn { font-size: 13px; padding: 7px 16px; }
        }
        @media (min-width: 1000px) {
            #skip-prompt { bottom: 20%; right: 16px; }
        }

        /* ---- Seekbar timestamp markers ---- */
        .seekbar-marker {
            position: absolute;
            top: 0;
            height: 100%;
            pointer-events: none;
            opacity: 0.75;
        }
        .seekbar-marker.intro  { background: rgba(255, 200, 0, 0.7); }
        .seekbar-marker.recap  { background: rgba(100, 180, 255, 0.7); }
        .seekbar-marker.credits{ background: rgba(180, 120, 255, 0.7); }
        .seekbar-marker.preview{ background: rgba(80, 220, 120, 0.7); }

        /* ---- Seek bar hover timestamp + thumbnail tooltip ---- */
        #seek-tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 50;
        }
        #seek-tooltip.visible { opacity: 1; }
        #seek-thumb-image {
            width: 160px;
            height: 90px;
            background-color: #111;
            background-repeat: no-repeat;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.15);
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
        }
        #seek-tooltip-time {
            margin-top: 6px;
            background: rgba(15, 15, 15, 0.92);
            color: #fff;
            font-family: 'Netflix Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 4px 9px;
            border-radius: 4px;
            white-space: nowrap;
        }
        @media (max-width: 600px) {
            #seek-thumb-image { width: 120px; height: 67px; }
            #seek-tooltip-time { font-size: 11px; padding: 3px 7px; }
        }

        /* ---- Server Menu Styles ---- */
        #server-menu {
            position: absolute;
            top: 60px;
            left: 16px;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 9999;
            min-width: 200px;
            display: none;
            border: 1px solid #333;
        }
        #server-menu.visible {
            display: block;
        }
        #server-menu h4 {
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            margin: 0 0 8px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }
        .server-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            color: #b3b3b3;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s;
            font-size: 14px;
        }
        .server-option:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .server-option.active {
            color: #fff;
            background: rgba(225,0,0,0.2);
        }
        .server-option .check-icon {
            margin-left: auto;
            visibility: hidden;
        }
        .server-option.active .check-icon {
            visibility: visible;
        }
